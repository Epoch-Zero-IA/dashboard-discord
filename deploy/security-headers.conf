# Included per location rather than set once on the server block: nginx does not
# inherit add_header into a child block that declares any add_header of its own, so
# /assets/ — which sets Cache-Control — would silently lose every header below.

# Never let a browser second-guess a Content-Type; that is how a .js served as text
# ends up executed, or an upload gets sniffed into something active.
add_header X-Content-Type-Options "nosniff" always;

# No framing at all. frame-ancestors in the CSP says the same thing to modern
# browsers; this covers the ones that only know the older header.
add_header X-Frame-Options "DENY" always;

# Send the origin cross-site, the full path only to ourselves — so an outbound link
# never leaks a path or query string that identifies a user.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# The bundle is entirely self-hosted: no CDN, no inline script, no eval. Vite emits
# <script type="module" src="/assets/…"> and extracts component styles into a real
# stylesheet, so 'self' is enough and no 'unsafe-inline' is needed. data: covers
# inlined images only. connect-src 'self' is what lets the SPA call /api — single
# origin, so nothing else has to be allowed.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; form-action 'self'" always;
