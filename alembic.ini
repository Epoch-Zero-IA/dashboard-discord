# Alembic lives inside core/, the package that owns the schema: migrations belong to
# the same unit as the models they migrate, and neither the API nor the bot has a say.
#
# There is deliberately no `sqlalchemy.url` here. env.py reads DATABASE_URL from the
# environment instead, so the URL is defined in exactly one place — and a test harness
# can override it in-process with `set_main_option`, which is how the db-marked tests
# migrate a throwaway database without touching this file.
[alembic]
script_location = core/migrations
prepend_sys_path = .

# Timestamped, prefixed revision files: the directory then reads in chronological order,
# which a bare hash never does.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
