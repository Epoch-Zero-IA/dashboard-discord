services:
  # The public entrypoint: serves the bundle and proxies /api to the API.
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    # Injected into /api/ requests server-side, so the browser never sees it.
    # `:?` on purpose: a missing key must stop the deployment, not ship an open API.
    environment:
      API_KEY: ${API_KEY:?set API_KEY in .env (see .env.example)}
    ports:
      - "8000:8080"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      # Vertical scaling: one Granian worker per core is a sane starting point.
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-1}
      # The same key the guard on /api/hello checks against.
      API_KEY: ${API_KEY:?set API_KEY in .env (see .env.example)}
      # Built here rather than taken from .env: inside the compose network the host is
      # the service name, while DATABASE_URL in .env points at 127.0.0.1 for the tools
      # that run on the host (alembic, pytest, `just dev-bot`). One variable for two
      # different hosts is the mistake this split avoids.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dashboard}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@db:5432/${POSTGRES_DB:-dashboard_discord}
    # No `ports`: the API is reachable only by web, over the compose network.
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/health")
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-dashboard_discord}
    # Published on purpose, and only here: the tests, alembic and `just dev-bot` run on
    # the host, not in the network. compose.prod.yml publishes nothing.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # `pg_isready` and not a TCP probe: Postgres accepts connections seconds before
      # it is ready to answer, and `depends_on: service_healthy` would let the API race
      # it and lose.
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-dashboard} -d ${POSTGRES_DB:-dashboard_discord}
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
